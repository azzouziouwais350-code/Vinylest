<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b1f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dream.player">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>♪ dream.player</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a1033; --bg2:#3b1f6b; --pink:#ff8fd8; --cyan:#7ff5ff;
  --yellow:#fff29a; --white:#fdf6ff; --dark:#120a24; --panel:#241447;
}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
html,body{height:100%}
body{
  font-family:'VT323',monospace;font-size:20px;color:var(--white);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%,#ff9ad5 100%);
  display:flex;justify-content:center;align-items:flex-start;
  padding:20px 12px 60px;min-height:100vh;overflow-x:hidden;position:relative;
}
/* sol damier dreamcore */
body::before{
  content:"";position:fixed;left:0;right:0;bottom:0;height:35vh;z-index:0;
  background:
    conic-gradient(#ffffff22 25%,#00000022 0 50%,#ffffff22 0 75%,#00000022 0) 0 0/48px 48px;
  transform:perspective(300px) rotateX(55deg);transform-origin:bottom;opacity:.7;
}
/* scanlines CRT */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
}
.cloud{position:fixed;z-index:0;width:120px;height:40px;background:#fff;opacity:.25;
  box-shadow:24px -16px 0 #fff,48px -16px 0 #fff,72px 0 0 #fff,-24px 0 0 #fff;
  animation:drift 60s linear infinite}
.cloud:nth-child(1){top:8%;left:-150px}
.cloud:nth-child(2){top:22%;left:-150px;animation-duration:90s;animation-delay:-30s;transform:scale(1.5)}
.cloud:nth-child(3){top:40%;left:-150px;animation-duration:75s;animation-delay:-55s}
@keyframes drift{to{transform:translateX(calc(100vw + 400px))}}
.star{position:fixed;width:4px;height:4px;background:#fff;z-index:0;animation:tw 2s steps(2) infinite}
@keyframes tw{50%{opacity:.2}}

.player{
  position:relative;z-index:2;width:100%;max-width:560px;
  background:var(--panel);border:4px solid var(--white);
  box-shadow:8px 8px 0 var(--dark),0 0 0 4px var(--pink),12px 12px 0 4px var(--dark);
  padding:14px;
}
.titlebar{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(90deg,var(--pink),var(--cyan));color:var(--dark);
  font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 10px;margin-bottom:12px;
}
.titlebar span:last-child{letter-spacing:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{
  flex:1;font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 4px;cursor:pointer;
  background:var(--dark);color:var(--white);border:3px solid var(--white);
}
.tab.active{background:var(--pink);color:var(--dark)}
.view{display:none}.view.active{display:block}

.screen{
  background:var(--dark);border:3px solid var(--cyan);padding:10px;margin-bottom:12px;
  box-shadow:inset 0 0 20px #7ff5ff33;
}
#viz{width:100%;height:90px;display:block;background:#0a0618}
.now{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.6;color:var(--yellow);
  margin-top:8px;white-space:nowrap;overflow:hidden}
.now span{display:inline-block;padding-left:100%;animation:marq 12s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.time{display:flex;justify-content:space-between;color:var(--cyan);margin-top:4px}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:14px;background:var(--dark);
  border:3px solid var(--white);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:20px;background:var(--pink);border:3px solid var(--white);
}
input[type=range]::-moz-range-thumb{width:10px;height:14px;background:var(--pink);border:3px solid var(--white);border-radius:0}

.controls{display:flex;gap:6px;justify-content:center;margin:12px 0}
.btn{
  font-family:'Press Start 2P',monospace;font-size:12px;min-width:46px;height:46px;cursor:pointer;
  background:var(--cyan);color:var(--dark);border:3px solid var(--white);
  box-shadow:4px 4px 0 var(--dark);
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--dark)}
.btn.big{background:var(--pink);min-width:64px}
.btn.on{background:var(--yellow)}
.vol{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:'Press Start 2P',monospace;font-size:10px}

.drop{
  border:3px dashed var(--pink);padding:16px;text-align:center;cursor:pointer;margin-bottom:12px;
  font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.8;background:#ffffff0a;
}
.drop.over{background:#ff8fd833;border-color:var(--yellow)}
.drop input{display:none}

.list{max-height:220px;overflow-y:auto;border:3px solid var(--white);background:var(--dark)}
.list::-webkit-scrollbar{width:12px}
.list::-webkit-scrollbar-track{background:var(--dark)}
.list::-webkit-scrollbar-thumb{background:var(--pink);border:2px solid var(--dark)}
.track{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-bottom:2px solid #ffffff18}
.track:hover{background:#ffffff14}
.track.cur{background:var(--pink);color:var(--dark)}
.track .n{font-family:'Press Start 2P',monospace;font-size:8px;width:28px}
.track .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .x{font-family:'Press Start 2P',monospace;font-size:9px;padding:4px 6px;border:2px solid currentColor}
.empty{padding:20px;text-align:center;color:#ffffff88}

.row{display:flex;gap:6px;margin-bottom:10px}
.row input[type=text]{
  flex:1;background:var(--dark);color:var(--white);border:3px solid var(--white);
  padding:10px;font-family:'VT323',monospace;font-size:20px;outline:none;
}
.row input[type=text]:focus{border-color:var(--pink)}
.hint{font-size:17px;color:#ffffffaa;margin-bottom:10px;line-height:1.1}
.spotify-frame{width:100%;border:3px solid var(--cyan);background:var(--dark);min-height:352px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.presets .btn{font-size:8px;height:34px;padding:0 8px}
.footer{text-align:center;font-family:'Press Start 2P',monospace;font-size:7px;margin-top:12px;color:#ffffff88}
</style>
</head>
<body>
<div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>

<div class="player">
  <div class="titlebar"><span>♪ DREAM.PLAYER</span><span>_ □ x</span></div>

  <div class="tabs">
    <button class="tab active" data-view="local">📼 FICHIERS</button>
    <button class="tab" data-view="spotify">🎧 SPOTIFY</button>
  </div>

  <!-- ===== VUE LOCALE ===== -->
  <div class="view active" id="view-local">
    <div class="screen">
      <canvas id="viz" width="256" height="48"></canvas>
      <div class="now"><span id="nowTitle">— aucune piste —</span></div>
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    </div>

    <div class="controls">
      <button class="btn" id="shuffle" title="Aléatoire">?</button>
      <button class="btn" id="prev">|◀</button>
      <button class="btn big" id="play">▶</button>
      <button class="btn" id="next">▶|</button>
      <button class="btn" id="repeat" title="Répéter">↻</button>
    </div>

    <div class="vol"><span>VOL</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></div>

    <label class="drop" id="drop">
      ▼ DÉPOSE TES MP3 ICI ▼<br>ou clique pour importer
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple>
    </label>

    <div class="list" id="list"><div class="empty">Playlist vide...</div></div>
  </div>

  <!-- ===== VUE SPOTIFY ===== -->
  <div class="view" id="view-spotify">
    <p class="hint">Colle un lien Spotify (playlist, album, titre, artiste ou podcast). Connecte-toi dans le lecteur pour écouter les titres en entier ; sinon tu auras des extraits de 30 s.</p>
    <div class="row">
      <input type="text" id="spUrl" placeholder="https://open.spotify.com/playlist/...">
      <button class="btn" id="spGo">OK</button>
    </div>
    <div class="presets" id="presets"></div>
    <iframe class="spotify-frame" id="spFrame" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" src="" title="Spotify"></iframe>
  </div>

  <div class="footer">~ le temps s'est arrêté ici ~</div>
</div>

<script>
const $ = s => document.querySelector(s);
const audio = new Audio();
audio.preload = 'metadata';
let tracks = [];       // {name, url}
let idx = -1, shuffle = false, repeat = 0; // 0 off, 1 all, 2 one

/* ---------- Étoiles ---------- */
for (let i = 0; i < 30; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 50 + 'vh';
  s.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(s);
}

/* ---------- Onglets ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#view-' + t.dataset.view).classList.add('active');
  if (t.dataset.view === 'spotify') audio.pause();
});

/* ---------- Utils ---------- */
const fmt = s => isNaN(s) ? '0:00' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const clean = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');

/* ---------- Import de fichiers ---------- */
function addFiles(files) {
  [...files].forEach(f => {
    if (!f.type.startsWith('audio/') && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name)) return;
    tracks.push({ name: clean(f.name), url: URL.createObjectURL(f) });
  });
  renderList();
  if (idx === -1 && tracks.length) load(0, false);
}
$('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- Playlist ---------- */
function renderList() {
  const l = $('#list');
  if (!tracks.length) { l.innerHTML = '<div class="empty">Playlist vide...</div>'; return; }
  l.innerHTML = '';
  tracks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'track' + (i === idx ? ' cur' : '');
    d.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="x">X</span>`;
    d.querySelector('.t').textContent = t.name;
    d.onclick = () => { load(i, true); };
    d.querySelector('.x').onclick = e => { e.stopPropagation(); removeTrack(i); };
    l.appendChild(d);
  });
}
function removeTrack(i) {
  URL.revokeObjectURL(tracks[i].url);
  tracks.splice(i, 1);
  if (i === idx) { audio.pause(); audio.removeAttribute('src'); idx = -1; setPlayIcon(); $('#nowTitle').textContent = '— aucune piste —'; if (tracks.length) load(Math.min(i, tracks.length - 1), false); }
  else if (i < idx) idx--;
  renderList();
}

/* ---------- Lecture ---------- */
function load(i, autoplay) {
  idx = i;
  audio.src = tracks[i].url;
  $('#nowTitle').textContent = '♪ ' + tracks[i].name + ' ♪';
  renderList();
  if (autoplay) play();
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: tracks[i].name, artist: 'dream.player' });
}
function setPlayIcon() { $('#play').textContent = audio.paused ? '▶' : '❚❚'; }
function play() { initAudioCtx(); audio.play().catch(() => {}); }
function toggle() { if (idx === -1) return; audio.paused ? play() : audio.pause(); }
function next(auto) {
  if (!tracks.length) return;
  if (auto && repeat === 2) { audio.currentTime = 0; play(); return; }
  let n;
  if (shuffle && tracks.length > 1) { do { n = Math.floor(Math.random() * tracks.length); } while (n === idx); }
  else { n = idx + 1; if (n >= tracks.length) { if (repeat === 1 || !auto) n = 0; else { audio.pause(); return; } } }
  load(n, true);
}
function prev() {
  if (!tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  load((idx - 1 + tracks.length) % tracks.length, true);
}
$('#play').onclick = toggle;
$('#next').onclick = () => next(false);
$('#prev').onclick = prev;
$('#shuffle').onclick = e => { shuffle = !shuffle; e.target.classList.toggle('on', shuffle); };
$('#repeat').onclick = e => {
  repeat = (repeat + 1) % 3;
  e.target.classList.toggle('on', repeat > 0);
  e.target.textContent = repeat === 2 ? '1' : '↻';
};
audio.addEventListener('play', setPlayIcon);
audio.addEventListener('pause', setPlayIcon);
audio.addEventListener('ended', () => next(true));
audio.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(audio.duration));
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime);
  if (audio.duration && !seeking) $('#seek').value = (audio.currentTime / audio.duration) * 100;
});
let seeking = false;
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; $('#cur').textContent = fmt(audio.duration * seek.value / 100); });
seek.addEventListener('change', () => { audio.currentTime = audio.duration * seek.value / 100; seeking = false; });
$('#vol').addEventListener('input', e => audio.volume = e.target.value);
audio.volume = 0.7;

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prev);
  navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') audio.currentTime += 5;
  if (e.code === 'ArrowLeft') audio.currentTime -= 5;
});

/* ---------- Visualiseur pixel ---------- */
let actx, analyser, data, started = false;
function initAudioCtx() {
  if (started) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    data = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser); analyser.connect(actx.destination);
    started = true;
  } catch (e) { console.warn(e); }
}
const cv = $('#viz'), c = cv.getContext('2d');
c.imageSmoothingEnabled = false;
let t = 0;
function draw() {
  requestAnimationFrame(draw);
  t++;
  c.fillStyle = '#0a0618'; c.fillRect(0, 0, 256, 48);
  const bars = 32, w = 8;
  if (analyser) analyser.getByteFrequencyData(data);
  for (let i = 0; i < bars; i++) {
    let v = analyser && !audio.paused ? data[i] / 255 : (Math.sin(t / 30 + i / 3) + 1) / 12;
    const h = Math.max(1, Math.round(v * 12)) ;
    for (let j = 0; j < h; j++) {
      c.fillStyle = j > 9 ? '#fff29a' : j > 5 ? '#ff8fd8' : '#7ff5ff';
      c.fillRect(i * w + 1, 48 - (j + 1) * 4, w - 2, 3);
    }
  }
}
draw();

/* ---------- Spotify (embed) ---------- */
const presets = [
  ['Top 50 Monde', 'https://open.spotify.com/playlist/37i9dQZEVXbMDoHDwVN2tF'],
  ['Lofi Beats', 'https://open.spotify.com/playlist/37i9dQZF1DWWQRwui0ExPn'],
  ['Dreamy', 'https://open.spotify.com/playlist/37i9dQZF1DX6uQnrQkSAYA']
];
const frame = $('#spFrame');
function toEmbed(url) {
  url = url.trim();
  const m = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|artist|show|episode)\/([A-Za-z0-9]+)/i)
        || url.match(/^spotify:(track|album|playlist|artist|show|episode):([A-Za-z0-9]+)/i);
  if (!m) return null;
  return `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`;
}
function loadSpotify(url) {
  const e = toEmbed(url);
  if (!e) { $('#spUrl').style.borderColor = '#ff5d7a'; $('#spUrl').value = ''; $('#spUrl').placeholder = 'Lien Spotify invalide !'; return; }
  $('#spUrl').style.borderColor = '';
  frame.src = e;
  const type = e.split('/embed/')[1].split('/')[0];
  frame.style.height = (type === 'track' || type === 'episode') ? '152px' : '352px';
  localStorage.setItem('dream_sp', url);
}
presets.forEach(([n, u]) => {
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = n;
  b.onclick = () => { $('#spUrl').value = u; loadSpotify(u); };
  $('#presets').appendChild(b);
});
$('#spGo').onclick = () => loadSpotify($('#spUrl').value);
$('#spUrl').addEventListener('keydown', e => { if (e.key === 'Enter') loadSpotify(e.target.value); });
try {
  const saved = localStorage.getItem('dream_sp') || presets[1][1];
  $('#spUrl').value = saved; loadSpotify(saved);
} catch (e) { loadSpotify(presets[1][1]); }
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(console.warn);
  });
}
</script>
</body>
</html>
