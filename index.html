<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♪ dream.player</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07060d"
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dream.player">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="premium.css">
</head>
<body>
<div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>

<main class="player">

  <div class="tabs">
    <button class="tab active" data-view="local">FICHIERS</button>
    <button class="tab" data-view="spotify">SPOTIFY</button>
  </div>

  <!-- ===== VUE LOCALE ===== -->
  <section class="view active" id="view-local">
    <div class="screen">
      <canvas id="viz" width="128" height="48"></canvas>
      <div class="now" id="now"><span id="nowTitle">— aucune piste —</span></div>
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Position">
    </div>

    <div class="controls">
      <button class="btn" id="shuffle" aria-label="Aléatoire"></button>
      <button class="btn" id="prev" aria-label="Précédent"></button>
      <button class="btn big" id="play" aria-label="Lecture / pause"></button>
      <button class="btn" id="next" aria-label="Suivant"></button>
      <button class="btn" id="repeat" aria-label="Répéter"></button>
    </div>

    <div class="vol"><span>VOL</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>

    <label class="drop" id="drop">
      <span>▼ DÉPOSE TES MP3 ICI ▼</span>
      <small>ou touche pour importer</small>
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple>
    </label>

    <div class="list" id="list"><div class="empty">Playlist vide...</div></div>
  </section>

  <!-- ===== VUE SPOTIFY ===== -->
  <section class="view" id="view-spotify">
    <p class="hint">Colle un lien Spotify (playlist, album, titre, artiste ou podcast). Connecte-toi dans le lecteur pour écouter les titres en entier ; sinon tu auras des extraits de 30 s.</p>
    <div class="row">
      <input type="text" id="spUrl" placeholder="https://open.spotify.com/playlist/..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="spGo">OK</button>
    </div>
    <div class="presets" id="presets"></div>
    <iframe class="spotify-frame" id="spFrame" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" src="" title="Spotify"></iframe>
  </section>

  <div class="footer">~ le temps s'est arrêté ici ~</div>
</main>

<script src="script.js"></script>
<script src="features.js"></script>
<script src="premium.js"></script>
<script src="extras.js"></script>
<script src="more.js"></script>
<script src="final.js"></script>
<script src="settings.js"></script>
<script src="layout.js"></script>
<script src="diag.js"></script></body>
<script src="polish.js"></script>
</html>
